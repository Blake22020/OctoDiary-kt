name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/initial-sync-loading
      - feat/octoplan-student-fork

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoPlan-v0.1.0-debug
          path: app/build/outputs/apk/debug/*.apk
